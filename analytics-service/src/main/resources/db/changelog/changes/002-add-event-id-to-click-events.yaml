databaseChangeLog:
  - changeSet:
      id: 2
      author: natasha

      changes:
        - addColumn:
            tableName: click_events
            columns:
              - column:
                  name: event_id
                  type: UUID

        - sql:
            sql: >
              UPDATE click_events
              SET event_id = gen_random_uuid()
              WHERE event_id IS NULL;

        - addNotNullConstraint:
            tableName: click_events
            columnName: event_id
            columnDataType: UUID

        - addUniqueConstraint:
            tableName: click_events
            columnNames: event_id
            constraintName: uk_click_events_event_id