global:
  scrape_interval: 15s

scrape_configs:

  - job_name: "shortener-service"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets:
          - "shortener-service:8080"

  - job_name: "analytics-service"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets:
          - "analytics-service:8081"