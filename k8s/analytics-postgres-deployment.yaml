apiVersion: apps/v1
kind: Deployment

metadata:
  name: analytics-postgres

spec:
  replicas: 1

  selector:
    matchLabels:
      app: analytics-postgres

  template:
    metadata:
      labels:
        app: analytics-postgres

    spec:
      containers:
        - name: analytics-postgres
          image: postgres:15

          ports:
            - containerPort: 5432

          env:
            - name: POSTGRES_DB
              value: analytics_db

            - name: POSTGRES_USER
              value: postgres

            - name: POSTGRES_PASSWORD
              value: secret