apiVersion: apps/v1
kind: Deployment

metadata:
  name: analytics-service

spec:
  replicas: 2

  selector:
    matchLabels:
      app: analytics-service

  template:
    metadata:
      labels:
        app: analytics-service

    spec:
      containers:
        - name: analytics-service
          image: analytics-service:latest
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8081

          env:
            - name: DB_URL
              valueFrom:
                configMapKeyRef:
                  name: shortener-config
                  key: ANALYTICS_DB_URL

          envFrom:
            - configMapRef:
                name: shortener-config

            - secretRef:
                name: shortener-secret