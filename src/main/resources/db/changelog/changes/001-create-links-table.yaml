databaseChangeLog:
  - changeSet:
      id: 1
      author: natasha

      changes:
        - createTable:
            tableName: links

            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: short_code
                  type: VARCHAR(255)
                  constraints:
                    unique: true
                    nullable: false

              - column:
                  name: original_url
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: clicks
                  type: INT
                  constraints:
                    nullable: false

              - column:
                 name: created_at
                 type: TIMESTAMP
                 constraints:
                   nullable: false

              - column:
                  name: expires_at
                  type: TIMESTAMP
