services:
  postgres:
    image: postgres:15
    container_name: shortener-postgres
    environment:
      POSTGRES_DB: shortener_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d shortener_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  shortener-service:
    build: .
    container_name: shortener-service
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/shortener_db
      DB_USERNAME: postgres
      DB_PASSWORD: secret
    ports:
      - "8080:8080"

volumes:
  postgres_data: